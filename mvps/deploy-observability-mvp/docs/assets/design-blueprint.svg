<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024"><rect width="1536" height="1024" fill="#f4f7fb"/><rect x="40" y="34" width="1456" height="96" rx="18" fill="#172554"/><text x="76" y="78" font-size="30" font-family="Arial" font-weight="700" fill="white">部署可观察性 5 分钟闭环</text><text x="76" y="108" font-size="17" font-family="Arial" fill="#dbeafe">错误原文 → 上下文 → 根因假设 → 最小动作 → 回滚与复现</text><rect x="40" y="156" width="900" height="820" rx="18" fill="white" stroke="#dfe6f1"/><rect x="964" y="156" width="532" height="820" rx="18" fill="white" stroke="#dfe6f1"/><text x="76" y="204" font-size="22" font-family="Arial" font-weight="700">1. 故障证据输入</text><g font-family="Arial" font-size="15"><text x="76" y="252">项目 / 部署名称</text><rect x="76" y="268" width="828" height="46" rx="9" fill="#f8fafc" stroke="#cfd8e6"/><text x="76" y="354">错误原文</text><rect x="76" y="370" width="828" height="132" rx="10" fill="#f8fafc" stroke="#cfd8e6"/><text x="94" y="410" fill="#b91c1c">Artifact download returned HTTP 403</text><text x="76" y="542">上下文证据</text><rect x="76" y="558" width="828" height="112" rx="10" fill="#f8fafc" stroke="#cfd8e6"/><text x="94" y="598">Node.js v24.15.0 · Vercel CLI 56.5.0 · build.mjs:15</text><text x="76" y="710">可能根因与最小动作</text><rect x="76" y="726" width="828" height="154" rx="10" fill="#f8fafc" stroke="#cfd8e6"/><text x="94" y="770">事实：下载请求返回 403。</text><text x="94" y="806">推断：临时或受保护制品 URL 已失效。</text><text x="94" y="842">动作：迁移到仓库或公开稳定存储后重新部署。</text></g><text x="1000" y="204" font-size="22" font-family="Arial" font-weight="700">2. 诊断结果</text><rect x="1000" y="236" width="220" height="112" rx="14" fill="#f8fafc"/><text x="1024" y="272" font-family="Arial" font-size="14" fill="#64748b">证据完整度</text><text x="1024" y="320" font-family="Arial" font-size="38" font-weight="700">100%</text><rect x="1242" y="236" width="218" height="112" rx="14" fill="#f8fafc"/><text x="1266" y="272" font-family="Arial" font-size="14" fill="#64748b">诊断等级</text><text x="1266" y="320" font-family="Arial" font-size="38" font-weight="700">3/3</text><rect x="1000" y="380" width="460" height="128" rx="14" fill="#ecfdf5"/><text x="1026" y="426" font-family="Arial" font-size="23" font-weight="700" fill="#166534">可复用故障指纹</text><text x="1026" y="466" font-family="Arial" font-size="15" fill="#166534">可复现、可回滚、可验证，可进入经验库。</text><text x="1000" y="558" font-family="Arial" font-size="17" font-weight="700">检查项</text><g font-family="Arial" font-size="16" fill="#166534"><text x="1024" y="606">✓ 保留错误原文</text><text x="1024" y="650">✓ 记录运行上下文</text><text x="1024" y="694">✓ 根因与事实分离</text><text x="1024" y="738">✓ 定义 5 分钟验证动作</text><text x="1024" y="782">✓ 存在回滚点</text><text x="1024" y="826">✓ 存在复现步骤</text></g></svg>