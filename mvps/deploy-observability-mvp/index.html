<!doctype html><html lang='zh-CN'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>部署可观察性 5 分钟闭环</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#172033}*{box-sizing:border-box}body{margin:0}.app{max-width:1120px;margin:auto;padding:20px}header{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:#fff;padding:22px;border-radius:18px;margin-bottom:18px}h1{margin:0;font-size:29px}.sub{color:#dbeafe;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 390px;gap:18px}.card{background:white;border:1px solid #dfe6f1;border-radius:16px;padding:18px;box-shadow:0 8px 24px rgba(20,35,70,.06)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #cfd8e6;border-radius:10px;background:#f8fafc}textarea{min-height:80px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.ghost{background:#eef2ff;color:#3730a3}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:12px;padding:13px}.metric b{font-size:24px}.status{padding:14px;border-radius:12px;margin-top:12px}.bad{background:#fef2f2;color:#991b1b}.mid{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.list{display:grid;gap:9px;margin-top:12px}.item{border:1px solid #e5e7eb;border-radius:11px;padding:11px}.ok{color:#166534}.no{color:#b91c1c}small{color:#64748b}@media(max-width:760px){.app{padding:12px}.grid,.row{grid-template-columns:1fr}h1{font-size:23px}}</style></head><body><div class='app'><header><h1>部署可观察性 5 分钟闭环</h1><div class='sub'>把“构建失败”从黑盒报错变成可定位、可复盘、可行动的证据链</div></header><div class='grid'><section class='card'><label>项目 / 部署名称</label><input id='name'><div class='row'><div><label>阶段</label><select id='stage'><option>构建</option><option>部署</option><option>运行</option></select></div><div><label>最终状态</label><select id='state'><option value='error'>ERROR</option><option value='ready'>READY</option></select></div></div><label>错误原文</label><textarea id='error'></textarea><label>上下文证据</label><textarea id='context'></textarea><label>可能根因</label><textarea id='cause'></textarea><label>下一步最小动作</label><textarea id='action'></textarea><div class='row'><div><label>是否有回滚点</label><select id='rollback'><option value='0'>没有</option><option value='1'>有</option></select></div><div><label>是否有复现步骤</label><select id='repro'><option value='0'>没有</option><option value='1'>有</option></select></div></div><div class='actions'><button class='primary' id='evaluate'>生成诊断结论</button><button class='ghost' id='sample'>载入 403 示例</button><button class='ghost' id='save'>保存记录</button><button class='ghost' id='export'>导出 Markdown</button></div></section><aside><div class='card'><div class='metrics'><div class='metric'><small>证据完整度</small><br><b id='score'>0%</b></div><div class='metric'><small>诊断等级</small><br><b id='level'>0</b>/3</div></div><div id='status' class='status bad'><b>仍是黑盒故障</b><div>缺少错误原文、上下文或可验证动作。</div></div><div id='checks' class='list'></div></div><div class='card' style='margin-top:18px'><b>最近故障指纹</b><div id='records' class='list'></div></div></aside></div></div><script>const ids=['name','stage','state','error','context','cause','action','rollback','repro'];const $=i=>document.getElementById(i);function data(){return Object.fromEntries(ids.map(i=>[i,$(i).value.trim()]))}function calc(){const d=data();const checks=[{ok:!!d.error,label:'保留错误原文'},{ok:!!d.context,label:'记录运行上下文'},{ok:!!d.cause,label:'列出有限根因'},{ok:!!d.action,label:'定义 5 分钟验证动作'},{ok:d.rollback==='1',label:'存在回滚点'},{ok:d.repro==='1',label:'存在复现步骤'}];const n=checks.filter(x=>x.ok).length,score=Math.round(n/checks.length*100);let level=0;if(n>=3)level=1;if(n>=5)level=2;if(n===6)level=3;$('score').textContent=score+'%';$('level').textContent=level;$('checks').innerHTML=checks.map(x=>`<div class='item ${x.ok?'ok':'no'}'>${x.ok?'✓':'✕'} ${x.label}</div>`).join('');let cls='bad',title='仍是黑盒故障',text='先补齐错误原文、上下文和验证动作。';if(level===1){cls='mid';title='可形成初步假设';text='可以继续排查，但不能宣称根因已确认。'}if(level===2){cls='mid';title='可执行最小诊断';text='证据基本齐全，执行单一验证动作。'}if(level===3){cls='good';title='已形成可复用故障指纹';text='可复现、可回滚、可验证，可进入经验库。'}$('status').className='status '+cls;$('status').innerHTML=`<b>${title}</b><div>${text}</div>`;return {d,checks,score,level,title,time:new Date().toISOString()}}function records(){return JSON.parse(localStorage.getItem('deploy-observability')||'[]')}function render(){const r=records();$('records').innerHTML=r.length?r.map(x=>`<div class='item'><b>${x.d.name}</b><div><small>${x.time.slice(0,16).replace('T',' ')}｜${x.title}</small></div></div>`).join(''):'<small>暂无记录</small>'}$('evaluate').onclick=calc;$('sample').onclick=()=>{$('name').value='daziya / dpl_dGM1hFAwkTnUpcf7y64EB3cQGCEt';$('stage').value='构建';$('state').value='error';$('error').value='Artifact download returned HTTP 403\nCommand npm run build exited with 1';$('context').value='Vercel CLI 56.5.0；Node.js v24.15.0；build.mjs:15；2026-07-23';$('cause').value='事实：下载请求返回 403。推断：构建依赖的临时或受保护制品 URL 已失效，或缺少授权头。';$('action').value='把制品复制进仓库或公开稳定存储，随后重新部署并确认下载返回 200。';$('rollback').value='1';$('repro').value='1';calc()};$('save').onclick=()=>{const x=calc();if(!x.d.name)return alert('请填写名称');const r=records();r.unshift(x);localStorage.setItem('deploy-observability',JSON.stringify(r.slice(0,20)));render()};$('export').onclick=()=>{const x=calc(),d=x.d;const md=`# ${d.name||'部署故障记录'}\n\n- 阶段：${d.stage}\n- 状态：${d.state}\n- 错误：${d.error}\n- 上下文：${d.context}\n- 根因：${d.cause}\n- 下一步：${d.action}\n- 回滚点：${d.rollback==='1'?'有':'无'}\n- 复现步骤：${d.repro==='1'?'有':'无'}\n- 结论：${x.title}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='deploy-observability.md';a.click();URL.revokeObjectURL(a.href)};ids.forEach(i=>$(i).addEventListener('input',calc));render();calc();</script></body></html>
