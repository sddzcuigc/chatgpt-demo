<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源租约与到期队列</title><style>:root{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033}*{box-sizing:border-box}body{margin:0}.app{max-width:1080px;margin:auto;padding:20px}header{background:#172554;color:white;padding:20px;border-radius:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 370px;gap:16px}.card{background:white;border:1px solid #dfe6f1;border-radius:14px;padding:16px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfd8e6;border-radius:9px}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:white}.ghost{background:#eef2ff;color:#3730a3}.status{padding:13px;border-radius:11px;margin-top:12px}.bad{background:#fef2f2;color:#991b1b}.mid{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.item{border:1px solid #e5e7eb;border-radius:9px;padding:10px;margin-top:8px}.expired{border-color:#fecaca;background:#fef2f2}.soon{border-color:#fed7aa;background:#fff7ed}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.app{padding:12px}}</style></head><body><div class="app"><header><h1>资源租约与到期队列</h1><div>占用只是开始；到期提醒、续租理由和清理证据决定复用是否可持续</div></header><div class="grid"><section class="card"><label>资源名称</label><input id="resource"><div class="row"><div><label>资源类型</label><select id="type"><option>GitHub 仓库</option><option>Vercel Project</option><option>其他实验资源</option></select></div><div><label>当前状态</label><select id="usage"><option value="idle">空闲/占位</option><option value="leased">租用中</option><option value="active">活跃使用</option></select></div></div><label>空闲或租用证据</label><textarea id="evidence"></textarea><div class="row"><div><label>租用至</label><input id="expires" type="date"></div><div><label>负责人</label><input id="owner"></div></div><label>隔离方式</label><textarea id="isolation"></textarea><label>退出/清理条件</label><textarea id="exit"></textarea><label>保护边界</label><textarea id="protected"></textarea><label>续租理由（仅到期前填写）</label><textarea id="renewal"></textarea><div class="actions"><button class="primary" id="evaluate">检查</button><button class="ghost" id="sample">示例</button><button class="ghost" id="save">保存到队列</button><button class="ghost" id="export">导出</button></div></section><aside><div class="card"><b>判断</b><div id="status" class="status bad"><b>禁止复用</b><div>缺少租约信息。</div></div><div id="checks"></div></div><div class="card" style="margin-top:16px"><b>到期队列</b><div id="queue"></div></div></aside></div></div><script>const ids=['resource','type','usage','evidence','expires','owner','isolation','exit','protected','renewal'];const $=x=>document.getElementById(x);function data(){return Object.fromEntries(ids.map(i=>[i,$(i).value.trim()]))}function days(s){if(!s)return null;return Math.ceil((new Date(s+'T23:59:59')-new Date())/86400000)}function calc(){const d=data(),left=days(d.expires),c=[['资源标识',d.resource],['证据',d.evidence],['租期',d.expires],['负责人',d.owner],['隔离',d.isolation],['退出条件',d.exit],['保护边界',d.protected]];let cls='bad',title='禁止复用',advice='租约字段不完整。';if(d.usage==='active'){title='活跃资源不可复用';advice='改选其他资源。'}else if(c.every(x=>x[1])){cls='good';title='租约有效';advice='按期使用并在到期前复查。'}if(left!==null&&left<0){cls='bad';title='租约已过期';advice='立即清理，或提交续租理由后重新审核。'}else if(left!==null&&left<=2&&c.every(x=>x[1])){cls='mid';title='即将到期';advice=d.renewal?'已有续租理由，等待复核。':'优先清理；确需继续时填写续租理由。'}$('status').className='status '+cls;$('status').innerHTML='<b>'+title+'</b><div>'+advice+(left!==null?' 剩余 '+left+' 天。':'')+'</div>';$('checks').innerHTML=c.map(x=>'<div class="item">'+(x[1]?'✓':'✕')+' '+x[0]+'</div>').join('');return {d,left,title,time:new Date().toISOString()}}function rec(){return JSON.parse(localStorage.getItem('resource-expiry-queue')||'[]')}function render(){const r=rec().sort((a,b)=>(a.d.expires||'9999').localeCompare(b.d.expires||'9999'));$('queue').innerHTML=r.length?r.map(x=>'<div class="item '+(x.left<0?'expired':x.left<=2?'soon':'')+'"><b>'+x.d.resource+'</b><br><small>'+x.title+'｜'+x.d.expires+'｜'+x.d.owner+'</small></div>').join(''):'<small>暂无记录</small>'}$('evaluate').onclick=calc;$('sample').onclick=()=>{$('resource').value='sddzcuigc/chatgpt-demo';$('usage').value='leased';$('evidence').value='历史示例仓库；本轮仅使用独立分支和 mvps 目录';$('expires').value='2026-07-25';$('owner').value='认知资产与 MVP 工厂';$('isolation').value='hourly 分支 + mvps/resource-slot-register/';$('exit').value='PR 关闭或到期后删除分支与 Preview';$('protected').value='main、根目录旧应用、生产配置';calc()};$('save').onclick=()=>{const x=calc(),r=rec();r.unshift(x);localStorage.setItem('resource-expiry-queue',JSON.stringify(r.slice(0,30)));render()};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(rec(),null,2)],{type:'application/json'}));a.download='resource-expiry-queue.json';a.click()};render();calc();</script></body></html>
