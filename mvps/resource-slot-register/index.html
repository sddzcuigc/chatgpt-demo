<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空闲资源占用登记</title><style>:root{font-family:system-ui,sans-serif;background:#f4f7fb;color:#172033}*{box-sizing:border-box}body{margin:0}.app{max-width:1050px;margin:auto;padding:20px}header{background:#172554;color:#fff;padding:20px;border-radius:16px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 360px;gap:16px}.card{background:#fff;border:1px solid #dfe6f1;border-radius:14px;padding:16px}label{display:block;font-size:13px;font-weight:700;margin:10px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #cfd8e6;border-radius:9px}textarea{min-height:72px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}button{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.ghost{background:#eef2ff;color:#3730a3}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.status{padding:13px;border-radius:11px;margin-top:12px}.bad{background:#fef2f2;color:#991b1b}.mid{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.item{border:1px solid #e5e7eb;border-radius:9px;padding:10px;margin-top:8px}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.app{padding:12px}}</style></head><body><div class="app"><header><h1>空闲资源占用登记</h1><div>复用不是随便塞：先确认资源空闲、设定租期、隔离路径和退出条件</div></header><div class="grid"><section class="card"><label>资源名称</label><input id="resource" placeholder="GitHub 仓库或 Vercel Project"><div class="row"><div><label>资源类型</label><select id="type"><option>GitHub 仓库</option><option>Vercel Project</option><option>其他实验资源</option></select></div><div><label>当前用途</label><select id="usage"><option value="unknown">未知</option><option value="idle">空闲/占位</option><option value="active">活跃使用</option></select></div></div><label>空闲证据</label><textarea id="evidence" placeholder="最近提交、开放 PR、部署、域名、负责人"></textarea><div class="row"><div><label>租用至</label><input id="expires" type="date"></div><div><label>负责人</label><input id="owner" placeholder="本轮负责人"></div></div><label>隔离方式</label><textarea id="isolation" placeholder="新分支、独立目录、独立路由"></textarea><label>退出/清理条件</label><textarea id="exit" placeholder="到期、合并、删除 Preview、释放资源"></textarea><label>禁止覆盖内容</label><textarea id="protected" placeholder="main、生产域名、现有目录、活跃部署"></textarea><div class="actions"><button class="primary" id="evaluate">检查是否可复用</button><button class="ghost" id="sample">载入示例</button><button class="ghost" id="save">保存</button><button class="ghost" id="export">导出</button></div></section><aside><div class="card"><b>判断</b><div id="status" class="status bad"><b>禁止复用</b><div>缺少空闲证据或隔离规则。</div></div><div id="checks"></div></div><div class="card" style="margin-top:16px"><b>最近占用</b><div id="records"></div></div></aside></div></div><script>const ids=['resource','type','usage','evidence','expires','owner','isolation','exit','protected'];const $=x=>document.getElementById(x);function data(){return Object.fromEntries(ids.map(i=>[i,$(i).value.trim()]))}function calc(){const d=data();const c=[['资源标识',d.resource],['确认空闲',d.usage==='idle'],['空闲证据',d.evidence],['租期',d.expires],['负责人',d.owner],['隔离规则',d.isolation],['退出条件',d.exit],['保护边界',d.protected]];const n=c.filter(x=>x[1]).length;let cls='bad',title='禁止复用',advice='缺少空闲证据或隔离规则。';if(d.usage==='active'){title='活跃资源不可占用';advice='改选其他资源，不能覆盖现有项目。'}else if(n>=6){cls='mid';title='可临时占用';advice='仅在新分支和隔离目录中使用，到期必须释放。'}if(n===8){cls='good';title='可安全复用';advice='已具备证据、租期、负责人、隔离与退出机制。'}$('status').className='status '+cls;$('status').innerHTML='<b>'+title+'</b><div>'+advice+'</div>';$('checks').innerHTML=c.map(x=>'<div class="item">'+(x[1]?'✓':'✕')+' '+x[0]+'</div>').join('');return {d,title,n,time:new Date().toISOString()}}function rec(){return JSON.parse(localStorage.getItem('resource-slots')||'[]')}function render(){const r=rec();$('records').innerHTML=r.length?r.map(x=>'<div class="item"><b>'+x.d.resource+'</b><br><small>'+x.title+'｜'+x.d.expires+'</small></div>').join(''):'<small>暂无记录</small>'}$('evaluate').onclick=calc;$('sample').onclick=()=>{$('resource').value='sddzcuigc/chatgpt-demo';$('type').value='GitHub 仓库';$('usage').value='idle';$('evidence').value='无开放 PR；近期仅历史示例提交；无生产域名';$('expires').value='2026-07-30';$('owner').value='认知资产与 MVP 工厂';$('isolation').value='hourly 分支 + mvps/resource-slot-register/ 独立目录';$('exit').value='PR 关闭或 7 天到期后释放；不合并则删除分支';$('protected').value='main、根目录现有应用、任何生产配置';calc()};$('save').onclick=()=>{const x=calc(),r=rec();r.unshift(x);localStorage.setItem('resource-slots',JSON.stringify(r.slice(0,20)));render()};$('export').onclick=()=>{const x=calc();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download='resource-slot.json';a.click()};render();calc();</script></body></html>
