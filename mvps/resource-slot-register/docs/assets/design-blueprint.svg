<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900"><rect width="1440" height="900" fill="#f4f7fb"/><rect x="40" y="30" width="1360" height="100" rx="18" fill="#172554"/><text x="75" y="78" fill="white" font-size="30" font-family="Arial" font-weight="700">空闲资源占用登记</text><text x="75" y="108" fill="#dbeafe" font-size="17" font-family="Arial">复用不是随便塞：先确认空闲、设定租期、隔离路径和退出条件</text><rect x="40" y="155" width="850" height="700" rx="18" fill="white" stroke="#dfe6f1"/><rect x="915" y="155" width="485" height="700" rx="18" fill="white" stroke="#dfe6f1"/><text x="75" y="205" font-size="22" font-family="Arial" font-weight="700">资源租约</text><text x="75" y="260" font-size="16" font-family="Arial">资源：sddzcuigc/chatgpt-demo</text><text x="75" y="310" font-size="16" font-family="Arial">空闲证据：无开放 PR、无生产域名、仅历史示例提交</text><text x="75" y="360" font-size="16" font-family="Arial">租用至：2026-07-30　负责人：认知资产与 MVP 工厂</text><rect x="75" y="400" width="775" height="110" rx="12" fill="#eef2ff"/><text x="95" y="440" font-size="17" font-family="Arial" font-weight="700" fill="#3730a3">隔离方式</text><text x="95" y="478" font-size="15" font-family="Arial" fill="#3730a3">hourly 分支 + mvps/resource-slot-register/ 独立目录</text><rect x="75" y="535" width="775" height="110" rx="12" fill="#ecfdf5"/><text x="95" y="575" font-size="17" font-family="Arial" font-weight="700" fill="#166534">退出条件</text><text x="95" y="613" font-size="15" font-family="Arial" fill="#166534">7 天到期或 PR 关闭后释放；不合并则删除分支</text><rect x="75" y="670" width="775" height="110" rx="12" fill="#fef2f2"/><text x="95" y="710" font-size="17" font-family="Arial" font-weight="700" fill="#991b1b">保护边界</text><text x="95" y="748" font-size="15" font-family="Arial" fill="#991b1b">不得修改 main、根目录现有应用和生产配置</text><text x="950" y="205" font-size="22" font-family="Arial" font-weight="700">判断结果</text><rect x="950" y="240" width="415" height="130" rx="14" fill="#ecfdf5"/><text x="980" y="292" font-size="28" font-family="Arial" font-weight="700" fill="#166534">可安全复用</text><text x="980" y="330" font-size="15" font-family="Arial" fill="#166534">证据、租期、负责人、隔离和退出机制完整</text><text x="950" y="425" font-size="18" font-family="Arial" font-weight="700">检查项</text><text x="980" y="475" font-size="16" font-family="Arial" fill="#166534">✓ 资源标识</text><text x="980" y="515" font-size="16" font-family="Arial" fill="#166534">✓ 确认空闲</text><text x="980" y="555" font-size="16" font-family="Arial" fill="#166534">✓ 租期与负责人</text><text x="980" y="595" font-size="16" font-family="Arial" fill="#166534">✓ 隔离规则</text><text x="980" y="635" font-size="16" font-family="Arial" fill="#166534">✓ 退出条件</text><text x="980" y="675" font-size="16" font-family="Arial" fill="#166534">✓ 保护边界</text></svg>