<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900"><rect width="100%" height="100%" fill="#f4f7fb"/><rect x="40" y="35" width="1320" height="90" rx="18" fill="#172554"/><text x="75" y="85" font-size="32" font-family="Arial" font-weight="700" fill="white">资源租约与到期队列</text><text x="75" y="112" font-size="16" font-family="Arial" fill="#dbeafe">占用只是开始；到期提醒、续租理由和清理证据决定复用是否可持续</text><rect x="40" y="150" width="820" height="700" rx="16" fill="white" stroke="#dfe6f1"/><rect x="885" y="150" width="475" height="700" rx="16" fill="white" stroke="#dfe6f1"/><text x="75" y="200" font-size="22" font-family="Arial" font-weight="700">租约登记</text><text x="920" y="200" font-size="22" font-family="Arial" font-weight="700">到期队列</text><rect x="920" y="235" width="405" height="90" rx="12" fill="#fff7ed"/><text x="945" y="270" font-size="20" font-family="Arial" font-weight="700" fill="#9a3412">即将到期</text><text x="945" y="300" font-size="14" font-family="Arial" fill="#9a3412">chatgpt-demo｜剩余 2 天｜需要清理或续租</text><rect x="920" y="345" width="405" height="90" rx="12" fill="#fef2f2"/><text x="945" y="380" font-size="20" font-family="Arial" font-weight="700" fill="#991b1b">已过期</text><text x="945" y="410" font-size="14" font-family="Arial" fill="#991b1b">旧 Preview｜立即下线并释放资源</text><text x="75" y="260" font-size="15" font-family="Arial">资源名称 / 类型 / 状态 / 证据</text><text x="75" y="320" font-size="15" font-family="Arial">租用至 / 负责人 / 隔离方式</text><text x="75" y="380" font-size="15" font-family="Arial">退出条件 / 保护边界 / 续租理由</text><rect x="75" y="450" width="180" height="48" rx="10" fill="#2563eb"/><text x="128" y="480" font-size="16" font-family="Arial" fill="white">检查租约</text><rect x="75" y="540" width="740" height="110" rx="12" fill="#ecfdf5"/><text x="100" y="580" font-size="22" font-family="Arial" font-weight="700" fill="#166534">租约有效</text><text x="100" y="615" font-size="15" font-family="Arial" fill="#166534">按期使用，并在到期前复查清理或续租。</text></svg>