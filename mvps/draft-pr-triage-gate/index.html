<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Draft PR Triage Gate</title><style>:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.app{max-width:1180px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#172554,#4338ca);color:#fff;border-radius:18px;padding:22px;margin-bottom:18px}.hero h1{margin:0;font-size:30px}.hero p{margin:7px 0 0;color:#dbeafe}.grid{display:grid;grid-template-columns:1fr 380px;gap:18px}.card{background:#fff;border:1px solid #dfe6f1;border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(20,35,70,.06)}.row{display:grid;grid-template-columns:1.3fr .7fr .7fr .8fr auto;gap:8px;align-items:center;padding:10px;border:1px solid #e5e7eb;border-radius:12px;margin:8px 0}.row input,.row select{width:100%;padding:9px;border:1px solid #cfd8e6;border-radius:9px;background:#f8fafc}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:#2563eb;color:#fff}.ghost{background:#eef2ff;color:#3730a3}.danger{background:#fff1f2;color:#be123c}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafc;border-radius:12px;padding:13px}.metric b{font-size:25px}.status{padding:14px;border-radius:12px;margin-top:12px}.bad{background:#fef2f2;color:#991b1b}.mid{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.list{display:grid;gap:9px;margin-top:12px}.item{padding:10px;border:1px solid #e5e7eb;border-radius:10px}.small{font-size:12px;color:#64748b}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#eef2ff;color:#3730a3;font-size:12px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h2{margin:0}.empty{color:#64748b;padding:14px;text-align:center}@media(max-width:820px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 1fr}.row .wide{grid-column:1/-1}.app{padding:12px}.hero h1{font-size:24px}}@media(max-width:430px){.row{grid-template-columns:1fr}.row .wide{grid-column:auto}.actions button{width:100%}.metrics{grid-template-columns:1fr 1fr}.hero{padding:17px}}</style></head><body><div class="app"><section class="hero"><h1>Draft PR Triage Gate</h1><p>限制并行草稿，把“持续产生”改成“合并、关闭或明确保留”。</p></section><div class="grid"><main class="card"><div class="head"><h2>草稿 PR 清单</h2><button id="sample" class="ghost">载入真实场景</button></div><div id="rows"></div><div class="actions"><button id="add" class="ghost">新增 PR</button><button id="evaluate" class="primary">执行分诊</button><button id="save" class="ghost">保存</button><button id="export" class="ghost">导出 Markdown</button><button id="clear" class="danger">清空</button></div></main><aside><section class="card"><div class="metrics"><div class="metric"><span class="small">开放草稿</span><br><b id="openCount">0</b></div><div class="metric"><span class="small">建议保留</span><br><b id="keepCount">0</b></div></div><div id="status" class="status bad"><b>尚未评估</b><div>载入或填写草稿 PR。</div></div><div id="results" class="list"></div></section><section class="card" style="margin-top:18px"><b>门禁规则</b><div class="list"><div class="item">活跃草稿上限：3 个</div><div class="item">7 天内无验证动作：优先关闭</div><div class="item">与其他 PR 高度重复：合并主题</div><div class="item">只有结论、无用户验证：暂停扩展</div></div></section></aside></div></div><script>const rowsEl=document.getElementById('rows');let rows=[];const esc=s=>String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));function addRow(d={title:'',age:0,evidence:0,overlap:0}){rows.push({...d});renderRows()}function renderRows(){rowsEl.innerHTML=rows.length?rows.map((r,i)=>`<div class="row"><input class="wide" data-k="title" data-i="${i}" value="${esc(r.title)}" placeholder="PR 标题"><input data-k="age" data-i="${i}" type="number" value="${r.age}" min="0"><select data-k="evidence" data-i="${i}"><option value="0" ${r.evidence==0?'selected':''}>无验证</option><option value="1" ${r.evidence==1?'selected':''}>有验证</option></select><select data-k="overlap" data-i="${i}"><option value="0" ${r.overlap==0?'selected':''}>低重叠</option><option value="1" ${r.overlap==1?'selected':''}>高重叠</option></select><button class="danger" onclick="removeRow(${i})">删除</button></div>`).join(''):'<div class="empty">暂无草稿 PR</div>';rowsEl.querySelectorAll('input,select').forEach(el=>el.oninput=()=>{const i=+el.dataset.i,k=el.dataset.k;rows[i][k]=k==='title'?el.value:+el.value})}window.removeRow=i=>{rows.splice(i,1);renderRows()};function evaluate(){const res=rows.map(r=>{let action='保留',reason='有验证且重叠低';if(r.overlap===1){action='合并';reason='与其他 PR 高度重复'}else if(r.age>=7&&r.evidence===0){action='关闭';reason='超过 7 天且没有验证动作'}else if(r.evidence===0){action='暂停';reason='缺少用户或测试证据'}return {...r,action,reason}});let keep=res.filter(x=>x.action==='保留').length;document.getElementById('openCount').textContent=rows.length;document.getElementById('keepCount').textContent=keep;const st=document.getElementById('status');if(!rows.length){st.className='status bad';st.innerHTML='<b>没有输入</b><div>请先登记草稿 PR。</div>'}else if(keep>3){st.className='status bad';st.innerHTML='<b>禁止继续新增</b><div>建议保留数量超过 3 个。</div>'}else if(res.some(x=>x.action!=='保留')){st.className='status mid';st.innerHTML='<b>先清理，再开发</b><div>存在应关闭、合并或暂停的草稿。</div>'}else{st.className='status good';st.innerHTML='<b>可以继续</b><div>活跃草稿数量和证据状态均在门槛内。</div>'}document.getElementById('results').innerHTML=res.map(x=>`<div class="item"><b>${esc(x.title||'未命名')}</b> <span class="pill">${x.action}</span><div class="small">${x.reason}</div></div>`).join('');localStorage.setItem('draft-pr-triage',JSON.stringify({rows,res,time:new Date().toISOString()}));return res}document.getElementById('add').onclick=()=>addRow();document.getElementById('evaluate').onclick=evaluate;document.getElementById('save').onclick=()=>{evaluate();alert('已保存到本地')};document.getElementById('clear').onclick=()=>{rows=[];localStorage.removeItem('draft-pr-triage');renderRows();evaluate()};document.getElementById('sample').onclick=()=>{rows=[{title:'Artifact Access Gate',age:0,evidence:1,overlap:1},{title:'Deploy Observability',age:0,evidence:1,overlap:1},{title:'Runtime Compatibility Gate',age:0,evidence:1,overlap:1},{title:'Resource Slot Register',age:0,evidence:1,overlap:0},{title:'Resource Expiry Queue',age:0,evidence:0,overlap:1}];renderRows();evaluate()};document.getElementById('export').onclick=()=>{const r=evaluate();let md='# Draft PR 分诊\n\n'+r.map(x=>`- **${x.title||'未命名'}**：${x.action}（${x.reason}）`).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='draft-pr-triage.md';a.click();URL.revokeObjectURL(a.href)};const saved=JSON.parse(localStorage.getItem('draft-pr-triage')||'null');if(saved?.rows)rows=saved.rows;else addRow();renderRows();evaluate();</script></body></html>
