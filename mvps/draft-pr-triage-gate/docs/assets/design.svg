<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024"><rect width="1536" height="1024" fill="#f4f7fb"/><rect x="42" y="34" width="1452" height="108" rx="18" fill="#172554"/><text x="78" y="82" fill="white" font-size="32" font-family="Arial" font-weight="700">Draft PR Triage Gate</text><text x="78" y="116" fill="#dbeafe" font-size="17" font-family="Arial">限制并行草稿，把持续产生改成合并、关闭或明确保留</text><rect x="42" y="168" width="950" height="812" rx="18" fill="white" stroke="#dfe6f1"/><rect x="1018" y="168" width="476" height="812" rx="18" fill="white" stroke="#dfe6f1"/><text x="76" y="216" font-size="23" font-family="Arial" font-weight="700">草稿 PR 清单</text><g font-family="Arial" font-size="15"><rect x="76" y="250" width="880" height="86" rx="12" fill="#f8fafc" stroke="#e5e7eb"/><text x="98" y="282">Artifact Access Gate</text><text x="98" y="312" fill="#64748b">0 天｜有验证｜高重叠</text><rect x="812" y="272" width="112" height="38" rx="9" fill="#fff7ed"/><text x="842" y="297" fill="#9a3412">合并</text><rect x="76" y="352" width="880" height="86" rx="12" fill="#f8fafc" stroke="#e5e7eb"/><text x="98" y="384">Deploy Observability</text><text x="98" y="414" fill="#64748b">0 天｜有验证｜高重叠</text><rect x="812" y="374" width="112" height="38" rx="9" fill="#fff7ed"/><text x="842" y="399" fill="#9a3412">合并</text><rect x="76" y="454" width="880" height="86" rx="12" fill="#f8fafc" stroke="#e5e7eb"/><text x="98" y="486">Resource Slot Register</text><text x="98" y="516" fill="#64748b">0 天｜有验证｜低重叠</text><rect x="812" y="476" width="112" height="38" rx="9" fill="#ecfdf5"/><text x="842" y="501" fill="#166534">保留</text><rect x="76" y="556" width="880" height="86" rx="12" fill="#f8fafc" stroke="#e5e7eb"/><text x="98" y="588">Resource Expiry Queue</text><text x="98" y="618" fill="#64748b">0 天｜无验证｜高重叠</text><rect x="812" y="578" width="112" height="38" rx="9" fill="#fef2f2"/><text x="842" y="603" fill="#991b1b">暂停</text><rect x="76" y="690" width="210" height="46" rx="10" fill="#2563eb"/><text x="132" y="720" fill="white" font-size="16">执行分诊</text></g><text x="1050" y="216" font-size="23" font-family="Arial" font-weight="700">组合状态</text><rect x="1050" y="252" width="194" height="110" rx="14" fill="#f8fafc"/><text x="1074" y="286" fill="#64748b" font-family="Arial" font-size="14">开放草稿</text><text x="1074" y="334" font-family="Arial" font-size="38" font-weight="700">5</text><rect x="1260" y="252" width="194" height="110" rx="14" fill="#f8fafc"/><text x="1284" y="286" fill="#64748b" font-family="Arial" font-size="14">建议保留</text><text x="1284" y="334" font-family="Arial" font-size="38" font-weight="700">1</text><rect x="1050" y="390" width="404" height="126" rx="14" fill="#fff7ed"/><text x="1074" y="434" font-family="Arial" font-size="24" font-weight="700" fill="#9a3412">先清理，再开发</text><text x="1074" y="474" font-family="Arial" font-size="15" fill="#9a3412">存在应关闭、合并或暂停的草稿。</text><text x="1050" y="574" font-size="18" font-family="Arial" font-weight="700">门禁规则</text><text x="1074" y="620" font-size="16" font-family="Arial">• 活跃草稿上限：3 个</text><text x="1074" y="662" font-size="16" font-family="Arial">• 7 天无验证：优先关闭</text><text x="1074" y="704" font-size="16" font-family="Arial">• 高度重复：合并主题</text><text x="1074" y="746" font-size="16" font-family="Arial">• 无证据：暂停扩展</text></svg>