<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f6f8fb"/><rect x="32" y="28" width="1376" height="90" rx="18" fill="#172554"/><text x="70" y="70" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Draft PR WIP 门禁：从 6 个开放草稿压到 3 个</text><text x="70" y="100" font-family="Arial" font-size="16" fill="#dbeafe">真实分诊结果｜关闭重复与低优先级草稿，保留部署闭环三件套</text><rect x="32" y="142" width="660" height="710" rx="18" fill="#fff" stroke="#dbe3ef"/><text x="64" y="190" font-family="Arial" font-size="22" font-weight="700" fill="#111827">分诊前：6 个开放 Draft PR</text><g font-family="Arial" font-size="17"><rect x="64" y="220" width="596" height="74" rx="12" fill="#fff7ed"/><text x="88" y="250" fill="#9a3412">#1 Resource Slot Register</text><text x="88" y="278" fill="#64748b">被 #2 完整继承 → 关闭</text><rect x="64" y="310" width="596" height="74" rx="12" fill="#fff7ed"/><text x="88" y="340" fill="#9a3412">#2 Resource Expiry Queue</text><text x="88" y="368" fill="#64748b">无真实验证、低优先级 → 暂停并关闭</text><rect x="64" y="400" width="596" height="74" rx="12" fill="#fff7ed"/><text x="88" y="430" fill="#9a3412">#3 Runtime Compatibility Gate</text><text x="88" y="458" fill="#64748b">被 #4/#5 更完整诊断链承接 → 关闭</text><rect x="64" y="490" width="596" height="74" rx="12" fill="#ecfdf5"/><text x="88" y="520" fill="#166534">#4 Deploy Observability</text><text x="88" y="548" fill="#64748b">保留：故障定位与复盘核心</text><rect x="64" y="580" width="596" height="74" rx="12" fill="#ecfdf5"/><text x="88" y="610" fill="#166534">#5 Artifact Access Gate</text><text x="88" y="638" fill="#64748b">保留：403 制品访问阻断</text><rect x="64" y="670" width="596" height="74" rx="12" fill="#ecfdf5"/><text x="88" y="700" fill="#166534">#6 Draft PR Triage Gate</text><text x="88" y="728" fill="#64748b">保留：治理机制本身</text></g><rect x="724" y="142" width="684" height="710" rx="18" fill="#fff" stroke="#dbe3ef"/><text x="756" y="190" font-family="Arial" font-size="22" font-weight="700" fill="#111827">分诊后：3 个活跃草稿</text><rect x="756" y="224" width="620" height="160" rx="16" fill="#eef6ff"/><text x="788" y="270" font-family="Arial" font-size="18" font-weight="700" fill="#1d4ed8">WIP 上限：3</text><text x="788" y="308" font-family="Arial" font-size="17" fill="#334155">当前活跃：#4、#5、#6</text><text x="788" y="344" font-family="Arial" font-size="17" fill="#334155">新增条件：至少一个草稿完成验证、合并或关闭</text><rect x="756" y="414" width="620" height="180" rx="16" fill="#ecfdf5"/><text x="788" y="458" font-family="Arial" font-size="18" font-weight="700" fill="#166534">本轮实际产出</text><text x="788" y="496" font-family="Arial" font-size="17" fill="#334155">✓ 关闭 3 个草稿 PR</text><text x="788" y="532" font-family="Arial" font-size="17" fill="#334155">✓ 保留代码历史与分支</text><text x="788" y="568" font-family="Arial" font-size="17" fill="#334155">✓ 从“继续创建”转为“先收口”</text><rect x="756" y="624" width="620" height="154" rx="16" fill="#fef2f2"/><text x="788" y="668" font-family="Arial" font-size="18" font-weight="700" fill="#991b1b">下一步门禁</text><text x="788" y="706" font-family="Arial" font-size="17" fill="#334155">在 #4/#5/#6 任一项没有验证进展前，禁止新增 MVP PR。</text><text x="788" y="742" font-family="Arial" font-size="17" fill="#334155">优先任务：修复 chatgpt-demo 的 Node 24.x 与部署链路。</text></svg>