<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
<rect width="1536" height="1024" fill="#f4f7fb"/>
<rect x="36" y="30" width="1464" height="102" rx="20" fill="#172554"/>
<text x="74" y="76" fill="white" font-family="Arial" font-size="31" font-weight="700">Runtime Compatibility Gate</text>
<text x="74" y="108" fill="#dbeafe" font-family="Arial" font-size="17">部署前检查 Vercel Project 与仓库是否对 Node.js 24.x 达成一致</text>
<rect x="36" y="156" width="922" height="830" rx="18" fill="white" stroke="#dfe6f1"/>
<rect x="982" y="156" width="518" height="830" rx="18" fill="white" stroke="#dfe6f1"/>
<text x="70" y="204" font-family="Arial" font-size="22" font-weight="700">运行时契约</text>
<text x="70" y="248" font-family="Arial" font-size="14" font-weight="700">Vercel Project Node.js</text>
<rect x="70" y="264" width="400" height="52" rx="10" fill="#f8fafc" stroke="#cfd8e6"/>
<text x="92" y="297" font-family="Arial" font-size="18" fill="#b91c1c">18.x（已停用）</text>
<text x="500" y="248" font-family="Arial" font-size="14" font-weight="700">package.json engines.node</text>
<rect x="500" y="264" width="422" height="52" rx="10" fill="#f8fafc" stroke="#cfd8e6"/>
<text x="522" y="297" font-family="Arial" font-size="18" fill="#166534">&gt;=24 &lt;25</text>
<text x="70" y="360" font-family="Arial" font-size="14" font-weight="700">.nvmrc</text>
<rect x="70" y="376" width="400" height="52" rx="10" fill="#f8fafc" stroke="#cfd8e6"/>
<text x="92" y="409" font-family="Arial" font-size="18">24</text>
<text x="500" y="360" font-family="Arial" font-size="14" font-weight="700">.node-version</text>
<rect x="500" y="376" width="422" height="52" rx="10" fill="#f8fafc" stroke="#cfd8e6"/>
<text x="522" y="409" font-family="Arial" font-size="18" fill="#64748b">未设置</text>
<text x="70" y="472" font-family="Arial" font-size="14" font-weight="700">最近构建错误</text>
<rect x="70" y="488" width="852" height="120" rx="12" fill="#fef2f2" stroke="#fecaca"/>
<text x="92" y="530" font-family="Arial" font-size="17" fill="#991b1b">Found invalid or discontinued Node.js Version: "18.x"</text>
<text x="92" y="566" font-family="Arial" font-size="15" fill="#991b1b">代码已经升级，但 Vercel Project 仍锁定旧版本。</text>
<text x="70" y="652" font-family="Arial" font-size="14" font-weight="700">人工接管步骤</text>
<rect x="70" y="668" width="852" height="122" rx="12" fill="#eff6ff" stroke="#bfdbfe"/>
<text x="92" y="710" font-family="Arial" font-size="16" fill="#1e3a8a">Project → Settings → General → Node.js Version → 24.x</text>
<text x="92" y="746" font-family="Arial" font-size="16" fill="#1e3a8a">Save → Redeploy → 重新检查构建日志</text>
<rect x="70" y="830" width="220" height="50" rx="10" fill="#2563eb"/>
<text x="126" y="862" fill="white" font-family="Arial" font-size="16" font-weight="700">执行兼容性检查</text>
<text x="1018" y="204" font-family="Arial" font-size="22" font-weight="700">检查结论</text>
<rect x="1018" y="236" width="446" height="126" rx="14" fill="#fff7ed"/>
<text x="1044" y="282" font-family="Arial" font-size="25" font-weight="700" fill="#9a3412">只需修改 Vercel Project</text>
<text x="1044" y="324" font-family="Arial" font-size="15" fill="#9a3412">仓库已兼容 24.x，Project 设置仍是 18.x。</text>
<text x="1018" y="410" font-family="Arial" font-size="17" font-weight="700">逐项检查</text>
<text x="1044" y="456" font-family="Arial" font-size="16" fill="#b91c1c">✕ Vercel Project Node.js = 18.x</text>
<text x="1044" y="500" font-family="Arial" font-size="16" fill="#166534">✓ package.json engines.node = &gt;=24 &lt;25</text>
<text x="1044" y="544" font-family="Arial" font-size="16" fill="#166534">✓ .nvmrc = 24</text>
<text x="1044" y="588" font-family="Arial" font-size="16" fill="#166534">✓ .node-version 未设置</text>
<text x="1044" y="632" font-family="Arial" font-size="16" fill="#166534">✓ vercel.json 无旧版本冲突</text>
<rect x="1018" y="690" width="446" height="142" rx="14" fill="#ecfdf5"/>
<text x="1044" y="732" font-family="Arial" font-size="17" font-weight="700" fill="#166534">放行条件</text>
<text x="1044" y="770" font-family="Arial" font-size="15" fill="#166534">Project 与仓库都声明 24.x，且新构建日志</text>
<text x="1044" y="802" font-family="Arial" font-size="15" fill="#166534">不再出现 discontinued/18.x 错误。</text>
</svg>