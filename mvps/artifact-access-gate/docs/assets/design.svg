<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024"><rect width="1536" height="1024" fill="#f4f7fb"/><rect x="40" y="35" width="1456" height="105" rx="18" fill="#4c1d95"/><text x="78" y="82" font-family="Arial" font-size="32" font-weight="700" fill="white">制品可获得性门禁</text><text x="78" y="116" font-family="Arial" font-size="17" fill="#ede9fe">403 不是再试一次：先验证地址、授权、寿命、完整性和备用来源</text><rect x="40" y="165" width="900" height="820" rx="18" fill="white" stroke="#ddd6fe"/><rect x="965" y="165" width="531" height="820" rx="18" fill="white" stroke="#ddd6fe"/><text x="75" y="215" font-family="Arial" font-size="23" font-weight="700">访问契约</text><text x="75" y="265" font-family="Arial" font-size="15">制品来源</text><rect x="75" y="282" width="830" height="48" rx="9" fill="#fafafa" stroke="#d7d7e2"/><text x="95" y="312" font-family="Arial" font-size="15" fill="#64748b">https://artifact.example/build.zip</text><text x="75" y="378" font-family="Arial" font-size="15">访问方式：临时签名 URL</text><text x="475" y="378" font-family="Arial" font-size="15">最近状态：403</text><text x="75" y="438" font-family="Arial" font-size="15">预计有效期：60 分钟</text><text x="475" y="438" font-family="Arial" font-size="15">构建耗时：20 分钟</text><rect x="75" y="480" width="830" height="100" rx="12" fill="#fff7ed"/><text x="100" y="520" font-family="Arial" font-size="18" font-weight="700" fill="#9a3412">风险：链接寿命不足或凭证已失效</text><text x="100" y="553" font-family="Arial" font-size="15" fill="#9a3412">不要重试同一 URL；应刷新授权或切换备用来源。</text><rect x="75" y="620" width="830" height="120" rx="12" fill="#f5f3ff"/><text x="100" y="660" font-family="Arial" font-size="18" font-weight="700" fill="#6b21a8">完整性与备用路径</text><text x="100" y="695" font-family="Arial" font-size="15">SHA-256、版本、文件大小；Release / 镜像 / 同工作流 artifact</text><rect x="75" y="790" width="220" height="48" rx="10" fill="#7c3aed"/><text x="132" y="821" font-family="Arial" font-size="16" font-weight="700" fill="white">执行门禁</text><text x="1000" y="215" font-family="Arial" font-size="23" font-weight="700">门禁结果</text><rect x="1000" y="250" width="220" height="115" rx="14" fill="#faf7ff"/><text x="1025" y="288" font-family="Arial" font-size="14" fill="#64748b">可获得性评分</text><text x="1025" y="338" font-family="Arial" font-size="42" font-weight="700">50/100</text><rect x="1240" y="250" width="220" height="115" rx="14" fill="#faf7ff"/><text x="1265" y="288" font-family="Arial" font-size="14" fill="#64748b">门禁等级</text><text x="1265" y="338" font-family="Arial" font-size="42" font-weight="700">1/3</text><rect x="1000" y="395" width="460" height="125" rx="14" fill="#fef2f2"/><text x="1025" y="438" font-family="Arial" font-size="24" font-weight="700" fill="#991b1b">禁止进入构建</text><text x="1025" y="475" font-family="Arial" font-size="15" fill="#991b1b">403 且未完成真实授权验证。</text><text x="1025" y="585" font-family="Arial" font-size="16" fill="#166534">✓ 来源地址明确</text><text x="1025" y="630" font-family="Arial" font-size="16" fill="#b91c1c">✕ 最近状态不是 200</text><text x="1025" y="675" font-family="Arial" font-size="16" fill="#166534">✓ 访问方式已识别</text><text x="1025" y="720" font-family="Arial" font-size="16" fill="#b91c1c">✕ 完整性校验不足</text><text x="1025" y="765" font-family="Arial" font-size="16" fill="#166534">✓ 存在备用来源</text></svg>