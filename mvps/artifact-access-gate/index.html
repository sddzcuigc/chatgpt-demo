<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制品可获得性门禁</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#172033}*{box-sizing:border-box}body{margin:0}.app{max-width:1120px;margin:auto;padding:22px}header{background:linear-gradient(135deg,#3b1d65,#7c3aed);color:#fff;padding:22px;border-radius:18px;margin-bottom:18px}h1{margin:0;font-size:29px}.sub{color:#ede9fe;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 390px;gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;box-shadow:0 8px 28px rgba(40,25,75,.06)}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input,textarea,select{width:100%;padding:11px;border:1px solid #d7d7e2;border-radius:10px;background:#fafafa}textarea{min-height:82px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#7c3aed;color:#fff}.ghost{background:#f3e8ff;color:#6b21a8}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#faf7ff;border-radius:12px;padding:13px}.metric b{font-size:24px}.status{padding:14px;border-radius:12px;margin-top:12px}.bad{background:#fef2f2;color:#991b1b}.mid{background:#fff7ed;color:#9a3412}.good{background:#ecfdf5;color:#166534}.list{display:grid;gap:9px;margin-top:12px}.item{border:1px solid #e5e7eb;border-radius:11px;padding:11px}.ok{color:#166534}.no{color:#b91c1c}small{color:#64748b}@media(max-width:760px){.app{padding:13px}.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}h1{font-size:23px}}</style></head><body><div class="app"><header><h1>制品可获得性门禁</h1><div class="sub">403 不是“再试一次”：先验证下载地址、授权、寿命和备用来源</div></header><div class="grid"><section class="card"><label>制品名称</label><input id="name"><label>下载地址或来源</label><input id="url"><div class="row"><div><label>访问方式</label><select id="auth"><option value="unknown">未知</option><option value="public">公开</option><option value="token">Token / Cookie</option><option value="signed">临时签名 URL</option></select></div><div><label>最近 HTTP 状态</label><input id="statusCode" type="number"></div></div><div class="row"><div><label>预计有效期（分钟）</label><input id="ttl" type="number"></div><div><label>构建预计耗时（分钟）</label><input id="buildTime" type="number"></div></div><label>所需权限或凭证</label><textarea id="permission"></textarea><label>校验信息</label><textarea id="integrity"></textarea><label>备用来源</label><textarea id="fallback"></textarea><label>真实探测证据</label><textarea id="evidence"></textarea><div class="actions"><button class="primary" id="evaluate">执行门禁</button><button class="ghost" id="sample">载入 403 示例</button><button class="ghost" id="save">保存</button><button class="ghost" id="export">导出 Markdown</button></div></section><aside><div class="card"><div class="metrics"><div class="metric"><small>可获得性评分</small><br><b id="score">0</b>/100</div><div class="metric"><small>门禁等级</small><br><b id="level">0</b>/3</div></div><div id="result" class="status bad"><b>禁止进入构建</b><div>制品访问条件尚未验证。</div></div><div id="checks" class="list"></div></div><div class="card" style="margin-top:18px"><b>最近记录</b><div id="records" class="list"></div></div></aside></div></div><script>const ids=['name','url','auth','statusCode','ttl','buildTime','permission','integrity','fallback','evidence'],$=id=>document.getElementById(id);function data(){return Object.fromEntries(ids.map(i=>[i,$(i).value.trim()]))}function calc(){const d=data(),s=Number(d.statusCode||0),ttl=Number(d.ttl||0),bt=Number(d.buildTime||0),checks=[{ok:!!d.url,label:'来源地址明确'},{ok:s===200,label:`最近状态为 200（当前 ${s||'未知'}）`},{ok:d.auth!=='unknown',label:'访问方式已识别'},{ok:!!d.permission,label:'权限要求已写明'},{ok:ttl>0&&bt>0&&ttl>=bt*2,label:'有效期覆盖两倍构建时间'},{ok:!!d.integrity,label:'存在完整性校验'},{ok:!!d.fallback,label:'存在备用来源'},{ok:!!d.evidence,label:'存在真实探测证据'}],score=Math.round(checks.filter(x=>x.ok).length/checks.length*100),level=score>=88?3:score>=63?2:score>=38?1:0;$('score').textContent=score;$('level').textContent=level;$('checks').innerHTML=checks.map(x=>`<div class="item ${x.ok?'ok':'no'}">${x.ok?'✓':'✕'} ${x.label}</div>`).join('');let cls='bad',title='禁止进入构建',msg='制品访问条件尚未验证。';if(level===1){cls='mid';title='只能人工试取';msg='可探索，但不能写入自动部署。'}if(level===2){cls='mid';title='可进入一次性构建';msg='当前可用，但长期稳定性不足。'}if(level===3){cls='good';title='允许进入自动构建';msg='访问、寿命、校验和备用来源均有证据。'}$('result').className='status '+cls;$('result').innerHTML=`<b>${title}</b><div>${msg}</div>`;return{d,checks,score,level,title,time:new Date().toISOString()}}function records(){return JSON.parse(localStorage.getItem('artifact-access-gate')||'[]')}function render(){const r=records();$('records').innerHTML=r.length?r.map(x=>`<div class="item"><b>${x.d.name}</b><div><small>${x.time.slice(0,16).replace('T',' ')}｜${x.title}</small></div></div>`).join(''):'<small>暂无记录</small>'}$('evaluate').onclick=calc;$('sample').onclick=()=>{$('name').value='Vercel 构建制品';$('url').value='临时 artifact 下载 URL';$('auth').value='signed';$('statusCode').value='403';$('ttl').value='60';$('buildTime').value='20';$('permission').value='需要有效临时凭证或 Actions read 权限';$('integrity').value='预期 SHA-256 与文件大小尚未记录';$('fallback').value='改用 Release 或在构建前重新生成签名 URL';$('evidence').value='2026-07-23 build.mjs 下载返回 HTTP 403；Node.js v24.15.0';calc()};$('save').onclick=()=>{const x=calc();if(!x.d.name)return alert('请填写名称');const r=records();r.unshift(x);localStorage.setItem('artifact-access-gate',JSON.stringify(r.slice(0,20)));render()};$('export').onclick=()=>{const x=calc(),d=x.d,md=`# ${d.name||'制品可获得性门禁'}\n\n- 来源：${d.url}\n- 访问方式：${d.auth}\n- 最近状态：${d.statusCode}\n- 有效期：${d.ttl} 分钟\n- 构建耗时：${d.buildTime} 分钟\n- 权限：${d.permission}\n- 完整性：${d.integrity}\n- 备用来源：${d.fallback}\n- 证据：${d.evidence}\n- 结论：${x.title}\n`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md],{type:'text/markdown'}));a.download='artifact-access-gate.md';a.click();URL.revokeObjectURL(a.href)};ids.forEach(i=>$(i).addEventListener('input',calc));render();calc();</script></body></html>
