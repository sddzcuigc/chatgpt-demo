<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><rect width="1440" height="900" fill="#f6f8fb"/><rect x="40" y="36" width="1360" height="84" rx="18" fill="#0f172a"/><text x="76" y="88" font-family="Arial" font-size="30" font-weight="700" fill="#fff">Node 24 证据看板：先收束，再进入主基线</text><text x="76" y="112" font-family="Arial" font-size="15" fill="#cbd5e1">配置、CI、Vercel 与独立验证应进入同一验收入口，而不是长期分散在多个 PR</text><rect x="40" y="144" width="850" height="700" rx="18" fill="#fff" stroke="#dbe2ea"/><rect x="918" y="144" width="482" height="700" rx="18" fill="#fff" stroke="#dbe2ea"/><text x="74" y="190" font-family="Arial" font-size="22" font-weight="700" fill="#111827">证据链状态</text><g font-family="Arial"><rect x="74" y="220" width="176" height="130" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="92" y="252" font-size="16" font-weight="700">1 仓库声明</text><text x="92" y="298" font-size="30" fill="#15803d">通过</text><text x="92" y="326" font-size="13">Node &gt;=24 &lt;25</text><rect x="270" y="220" width="176" height="130" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="288" y="252" font-size="16" font-weight="700">2 GitHub CI</text><text x="288" y="298" font-size="30" fill="#15803d">通过</text><text x="288" y="326" font-size="13">Run #20 success</text><rect x="466" y="220" width="176" height="130" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="484" y="252" font-size="16" font-weight="700">3 Vercel</text><text x="484" y="298" font-size="30" fill="#15803d">通过</text><text x="484" y="326" font-size="13">Settings 24.x / READY</text><rect x="662" y="220" width="176" height="130" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="680" y="252" font-size="16" font-weight="700">4 独立验证</text><text x="680" y="298" font-size="30" fill="#c2410c">待执行</text><text x="680" y="326" font-size="13">Docker 本地证明</text><rect x="74" y="386" width="764" height="118" rx="14" fill="#f8fafc" stroke="#dbe2ea"/><text x="94" y="420" font-size="16" font-weight="700">当前唯一命令</text><rect x="94" y="442" width="714" height="38" rx="8" fill="#111827"/><text x="112" y="467" font-size="15" fill="#fff">npm run proof:node24:local</text><text x="74" y="558" font-size="20" font-weight="700">收束逻辑</text><rect x="74" y="584" width="154" height="74" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="100" y="626" font-size="15">证据看板 PR</text><text x="244" y="630" font-size="24">→</text><rect x="282" y="584" width="154" height="74" rx="12" fill="#eff6ff" stroke="#bfdbfe"/><text x="305" y="616" font-size="15">CI 与 Preview</text><text x="318" y="638" font-size="15">验证通过</text><text x="452" y="630" font-size="24">→</text><rect x="490" y="584" width="154" height="74" rx="12" fill="#ecfdf5" stroke="#a7f3d0"/><text x="512" y="616" font-size="15">合并到 Node 24</text><text x="526" y="638" font-size="15">唯一基线 PR</text><text x="660" y="630" font-size="24">→</text><rect x="698" y="584" width="140" height="74" rx="12" fill="#fff7ed" stroke="#fed7aa"/><text x="720" y="616" font-size="15">等待独立验证</text><text x="731" y="638" font-size="15">再合并 main</text></g><text x="950" y="190" font-family="Arial" font-size="22" font-weight="700" fill="#111827">本轮验收</text><g font-family="Arial" font-size="16"><text x="950" y="238" fill="#15803d">✓ PR #9 CI：Node 24 success</text><text x="950" y="278" fill="#15803d">✓ Vercel Project：24.x</text><text x="950" y="318" fill="#15803d">✓ Preview：READY / HTTP 200</text><text x="950" y="358" fill="#15803d">✓ PR #9 已 squash 到 PR #7</text><text x="950" y="398" fill="#c2410c">△ 真实浏览器截图环境超时</text><text x="950" y="438" fill="#c2410c">△ 独立 Docker 验证尚未执行</text></g><rect x="950" y="486" width="418" height="150" rx="14" fill="#fef2f2" stroke="#fecaca"/><text x="974" y="522" font-family="Arial" font-size="17" font-weight="700" fill="#991b1b">禁止误判</text><text x="974" y="556" font-family="Arial" font-size="15" fill="#991b1b">看板可访问 ≠ Node 24 迁移完成</text><text x="974" y="586" font-family="Arial" font-size="15" fill="#991b1b">PR 已收束 ≠ 独立本地验证通过</text><text x="974" y="616" font-family="Arial" font-size="15" fill="#991b1b">设计图 ≠ 真实运行截图</text><rect x="950" y="674" width="418" height="112" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/><text x="974" y="710" font-family="Arial" font-size="17" font-weight="700" fill="#166534">决策规则</text><text x="974" y="746" font-family="Arial" font-size="15" fill="#166534">同一交付目标只保留一个长期验收入口；</text><text x="974" y="774" font-family="Arial" font-size="15" fill="#166534">子 PR 验证通过后立即收束，避免 WIP 再膨胀。</text></svg>