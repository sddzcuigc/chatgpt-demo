<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <rect width="1440" height="900" fill="#f4f7fb"/>
  <rect x="40" y="34" width="1360" height="92" rx="18" fill="#0f172a"/>
  <text x="76" y="76" fill="#fff" font-family="Arial" font-size="30" font-weight="700">Node 24 Local Proof Runner</text>
  <text x="76" y="108" fill="#cbd5e1" font-family="Arial" font-size="17">用固定容器把“本地是否真在 Node 24 下构建”变成可复核证据</text>
  <rect x="40" y="154" width="850" height="700" rx="18" fill="#fff" stroke="#dbe3ef"/>
  <text x="74" y="202" font-family="Arial" font-size="22" font-weight="700" fill="#111827">一键执行</text>
  <rect x="74" y="224" width="782" height="64" rx="12" fill="#111827"/>
  <text x="98" y="264" font-family="monospace" font-size="20" fill="#e2e8f0">npm run proof:node24:local</text>
  <text x="74" y="340" font-family="Arial" font-size="20" font-weight="700" fill="#111827">四阶段证据链</text>
  <g font-family="Arial" font-size="16">
    <rect x="74" y="372" width="170" height="120" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="100" y="414" fill="#1d4ed8" font-weight="700">1. 镜像构建</text>
    <text x="100" y="448" fill="#334155">node:24.4.0</text>
    <text x="100" y="474" fill="#334155">bookworm-slim</text>
    <rect x="274" y="372" width="170" height="120" rx="14" fill="#ecfdf5" stroke="#86efac"/>
    <text x="300" y="414" fill="#166534" font-weight="700">2. 版本审计</text>
    <text x="300" y="448" fill="#334155">node --version</text>
    <text x="300" y="474" fill="#334155">audit:node24</text>
    <rect x="474" y="372" width="170" height="120" rx="14" fill="#fff7ed" stroke="#fdba74"/>
    <text x="500" y="414" fill="#9a3412" font-weight="700">3. 项目构建</text>
    <text x="500" y="448" fill="#334155">npm install</text>
    <text x="500" y="474" fill="#334155">npm run build</text>
    <rect x="674" y="372" width="170" height="120" rx="14" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="700" y="414" fill="#6d28d9" font-weight="700">4. 证据门</text>
    <text x="700" y="448" fill="#334155">evidence JSON</text>
    <text x="700" y="474" fill="#334155">退出码 0</text>
  </g>
  <text x="74" y="558" font-family="Arial" font-size="20" font-weight="700" fill="#111827">数据流</text>
  <text x="74" y="600" font-family="Arial" font-size="17" fill="#334155">源码 → Docker build → Node 24 容器 → 安装 → 审计 → 构建 → 证据门 → PASS/FAIL</text>
  <rect x="74" y="646" width="782" height="150" rx="14" fill="#f8fafc" stroke="#dbe3ef"/>
  <text x="98" y="688" font-family="Arial" font-size="18" font-weight="700" fill="#111827">人工接管</text>
  <text x="98" y="726" font-family="Arial" font-size="16" fill="#475569">Docker 不可用时，安装 Node 24 并执行同一组审计、构建与证据命令。</text>
  <text x="98" y="758" font-family="Arial" font-size="16" fill="#475569">保存完整终端日志、时间戳和退出码。</text>
  <rect x="920" y="154" width="480" height="700" rx="18" fill="#fff" stroke="#dbe3ef"/>
  <text x="954" y="202" font-family="Arial" font-size="22" font-weight="700" fill="#111827">验收状态</text>
  <rect x="954" y="230" width="412" height="118" rx="14" fill="#ecfdf5"/>
  <text x="982" y="276" font-family="Arial" font-size="30" font-weight="700" fill="#166534">可复现</text>
  <text x="982" y="316" font-family="Arial" font-size="16" fill="#166534">Node 24、审计、构建和证据门统一执行</text>
  <g font-family="Arial" font-size="17" fill="#334155">
    <text x="970" y="404">✓ 固定 Node 24 镜像</text>
    <text x="970" y="452">✓ 一条命令执行</text>
    <text x="970" y="500">✓ 显式版本日志</text>
    <text x="970" y="548">✓ 失败即非零退出</text>
    <text x="970" y="596">✓ 无生产密钥</text>
  </g>
  <rect x="954" y="646" width="412" height="150" rx="14" fill="#fff7ed"/>
  <text x="982" y="688" font-family="Arial" font-size="18" font-weight="700" fill="#9a3412">最大盲区</text>
  <text x="982" y="726" font-family="Arial" font-size="16" fill="#9a3412">Linux 容器通过，不代表 Windows 或</text>
  <text x="982" y="754" font-family="Arial" font-size="16" fill="#9a3412">macOS 原生模块一定兼容。</text>
</svg>
