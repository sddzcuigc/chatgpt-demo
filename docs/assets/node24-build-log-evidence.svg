<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024"><rect width="1536" height="1024" fill="#f6f8fb"/><rect x="48" y="40" width="1440" height="104" rx="20" fill="#0f172a"/><text x="82" y="86" font-family="Arial" font-size="32" font-weight="700" fill="#fff">Node.js 24 构建证据闭环</text><text x="82" y="120" font-family="Arial" font-size="17" fill="#cbd5e1">仓库声明、平台设置、CI、本地与构建日志必须形成可复核证据链</text><g font-family="Arial"><rect x="48" y="174" width="930" height="802" rx="20" fill="#fff" stroke="#d7e0ec"/><text x="82" y="222" font-size="23" font-weight="700" fill="#111827">证据链</text><g><rect x="82" y="258" width="824" height="108" rx="16" fill="#ecfdf5" stroke="#86efac"/><text x="112" y="300" font-size="19" font-weight="700" fill="#166534">1. 仓库声明</text><text x="112" y="336" font-size="16" fill="#334155">package.json ≥24 &lt;25；.nvmrc / .node-version = 24</text></g><g><rect x="82" y="394" width="824" height="108" rx="16" fill="#ecfdf5" stroke="#86efac"/><text x="112" y="436" font-size="19" font-weight="700" fill="#166534">2. 平台控制面</text><text x="112" y="472" font-size="16" fill="#334155">Vercel Project Settings = 24.x</text></g><g><rect x="82" y="530" width="824" height="108" rx="16" fill="#eff6ff" stroke="#93c5fd"/><text x="112" y="572" font-size="19" font-weight="700" fill="#1d4ed8">3. 实际执行</text><text x="112" y="608" font-size="16" fill="#334155">CI / 本地 / Vercel 构建脚本主动打印 node --version</text></g><g><rect x="82" y="666" width="824" height="108" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="112" y="708" font-size="19" font-weight="700" fill="#9a3412">4. 可追溯输出</text><text x="112" y="744" font-size="16" fill="#334155">Deployment ID、Commit、Preview URL、时间与版本一并记录</text></g><rect x="82" y="810" width="824" height="118" rx="16" fill="#f8fafc" stroke="#cbd5e1"/><text x="112" y="854" font-size="20" font-weight="700" fill="#111827">完成判定</text><text x="112" y="892" font-size="17" fill="#334155">任何一处版本缺失或无法追溯：阻断合并；五处均为 24.x：允许进入审查。</text><rect x="10