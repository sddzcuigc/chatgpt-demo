    <text x="108" y="862" font-size="16" fill="#334155">Vercel → chatgpt-demo → Settings → General → Node.js Version → 24.x</text>
    <text x="108" y="896" font-size="16" fill="#334155">保存并重新部署，再更新 evidence JSON 后重新执行门禁。</text>
