    <text x="108" y="704" font-size="18" fill="#1e3a8a">npm run audit:node24:evidence</text>
    <text x="108" y="732" font-size="15" fill="#1e3a8a">任一信号不是 24.x，命令退出失败，不允许合并或标记完成。</text>
    <rect x="82" y="782" width="840" height="142" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
