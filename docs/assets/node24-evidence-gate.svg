    <text x="108" y="546" font-size="28" font-weight="700" fill="#b91c1c">18.x ✕</text>
    <rect x="518" y="430" width="404" height="150" rx="15" fill="#ecfdf5" stroke="#86efac"/>
    <text x="544" y="470" font-size="18" font-weight="700" fill="#166534">4. 构建日志</text>
