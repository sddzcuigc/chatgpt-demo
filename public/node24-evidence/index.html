<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Node 24 Evidence Dashboard</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#f4f7fb;color:#142033}*{box-sizing:border-box}body{margin:0}.app{max-width:1120px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;background:#071827;color:#fff;padding:20px;border-radius:16px}h1{font-size:25px;margin:0}.tag{font-size:12px;background:#1d4ed8;padding:5px 9px;border-radius:999px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.metric,.card{background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:16px}.metric b{display:block;font-size:24px;margin-top:6px}.ok{color:#15803d}.wait{color:#a16207}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:11px;border-bottom:1px solid #e5e7eb}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#dcfce7;color:#166534;font-size:12px}.steps{display:grid;gap:10px}.step{padding:12px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc}button{border:0;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer;background:#2563eb;color:#fff}.muted{color:#64748b;font-size:13px}pre{white-space:pre-wrap;background:#0f172a;color:#d1fae5;padding:13px;border-radius:10px;overflow:auto}.bar{height:10px;background:#e5e7eb;border-radius:99px;overflow:hidden}.bar span{display:block;height:100%;width:80%;background:#22c55e}@media(max-width:760px){.app{padding:12px}header{align-items:flex-start;gap:10px}.metrics{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.table thead{display:none}.table tr{display:block;border:1px solid #e5e7eb;border-radius:10px;margin:8px 0;padding:8px}.table td{display:flex;justify-content:space-between;border:0;padding:6px}.table td:before{content:attr(data-label);font-weight:700}.metric b{font-size:21px}}</style></head><body><main class="app"><header><div><h1>Node 24 证据链看板</h1><div class="muted" style="color:#cbd5e1;margin-top:6px">把仓库、CI、Vercel 与独立验证收束为一屏证据</div></div><span class="tag">MVP</span></header><section class="metrics"><div class="metric"><span>证据项</span><b>5</b></div><div class="metric"><span>已通过</span><b class="ok">4</b></div><div class="metric"><span>待验证</span><b class="wait">1</b></div><div class="metric"><span>完成度</span><b>80%</b><div class="bar"><span></span></div></div></section><section class="grid"><div class="card"><h2>版本证据</h2><table class="table"><thead><tr><th>检查点</th><th>版本</th><th>来源</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table></div><aside class="card"><h2>下一步</h2><div class="steps"><div class="step"><b>独立本地验证</b><p class="muted">在有 Docker 的非 CI 电脑运行：</p><pre>npm run proof:node24:local</pre></div><button id="copy">复制命令</button><div class="step"><b>验收规则</b><p class="muted">五项均为 Node 24.x，且证据包含时间、Commit 与日志，才允许合并。</p></div></div></aside></section></main><script>const data=[['仓库声明','>=24 <25','package.json','通过'],['版本文件','24','.nvmrc / .node-version','通过'],['GitHub CI','v24.15.0','Actions 日志','通过'],['Vercel','v24.15.0','Settings + Build Logs','通过'],['独立本地验证','待运行','Docker proof','待验证']];document.querySelector('#rows').innerHTML=data.map(r=>`<tr>${r.map((v,i)=>`<td data-label="${['检查点','版本','来源','状态'][i]}">${i===3?`<span class="badge" style="${v==='待验证'?'background:#fef3c7;color:#92400e':''}">${v}</span>`:v}</td>`).join('')}</tr>`).join('');document.querySelector('#copy').onclick=async()=>{await navigator.clipboard.writeText('npm run proof:node24:local');document.querySelector('#copy').textContent='已复制'};</script></body></html>
